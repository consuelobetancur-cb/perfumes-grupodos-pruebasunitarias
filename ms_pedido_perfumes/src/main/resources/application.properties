server.port=8082
spring.application.name=ms-pedido-perfume

spring.datasource.url=jdbc:mysql://localhost:3306/pedidos_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

catalogo.service.url=http://localhost:8083

usuarios.service.url=http://localhost:8084


feign.client.config.default.connect-timeout=3000
feign.client.config.default.read-timeout=5000

spring.autoconfigure.exclude=org.springframework.cloud.autoconfigure.LifecycleMvcEndpointAutoConfiguration

