spring:
  application:
    name: codigoms-gateway
  cloud:
    gateway:
      routes:
        
        
        # bd_carritos → puerto 8081
        - id: carrito-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/carritos/**

        # pedidos_db → puerto 8082
        - id: pedido-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/pedidos/**


        # catalogo_db → puerto 8083
        - id: catalogo-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/perfumes/**


        


server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
